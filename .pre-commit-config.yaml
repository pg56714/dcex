repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
        # Reviewable coverage data and official API schema snapshots for the 4,846-row audit.
        exclude: ^docs/(?:endpoint-coverage(?:-ledger\.json|\.html)|official-endpoint-inventory/.*\.json)$
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        # exclude: migrations/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args:
          - --fix
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.1
    hooks:
      - id: uv-lock

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.407
    hooks:
      - id: pyright

  - repo: local
    hooks:
      # The release workflow generates changelog sections from commit messages and
      # does not run pre-commit. Run with SKIP=no-manual-changelog for an intentional
      # formatting fix.
      - id: no-manual-changelog
        name: changelogs are generated by the release workflow
        language: fail
        entry: Do not edit CHANGELOG.md by hand; the release workflow writes it from Conventional Commit messages.
        files: ^(?:crates/dcex/)?CHANGELOG\.md$
        # Only new commits: pre-push would re-check already-committed history.
        stages: [pre-commit]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
      - id: commitizen-branch
        stages: [pre-push]
      # Install all three hook types so ruff/pyright run on commit too:
      # pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
