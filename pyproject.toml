[build-system]
build-backend = "maturin"
requires = ["maturin>=1.9,<2"]

[project]
authors = [
  {name = "pg56714"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Rust",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Networking",
]
dependencies = []
description = "Rust-backed Python bindings for low-latency cross-exchange crypto trading."
license = "MIT"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "THIRD_PARTY_NOTICES.md"]
name = "dcex"
readme = "README.md"
requires-python = ">=3.12"
version = "0.28.3"

[tool.uv]
default-groups = ["dev"]

[tool.maturin]
manifest-path = "crates/dcex-python/Cargo.toml"
module-name = "dcex._native"
python-source = "."

[project.urls]
Repository = "https://github.com/pg56714/dcex"

[dependency-groups]
dev = [
  "python-dotenv>=1.2.1",
  "pytest-asyncio>=1.2.0",
  "pyright[nodejs]>=1.1.407",
  "ruff>=0.14.2",
  "pytest>=8.4.2",
  "maturin>=1.9.0",
  "ipython>=9.14.1",
  "nest-asyncio>=1.6.0",
  "pre-commit>=4.6.0",
  "commitizen>=4.16.3",
]

[tool.ruff] # https://docs.astral.sh/ruff/settings/#top-level
exclude = [".venv", "tests", "examples"]
line-length = 100

[tool.ruff.lint] # https://docs.astral.sh/ruff/settings/#lint
extend-select = [
  # "ERA001", # commented-out-code
  "FAST001", # fast-api-redundant-response-model
  "FAST002", # fast-api-non-annotated-dependency
  "D100", # missing-module-docstring
  "D101", # undocumented-public-class
  "D102", # missing-class-docstring
  "D103", # undocumented-public-function
  "D213", # multi-line-summary-second-line
  "D400", # missing-trailing-period
]
select = [
  "B", # flake8-bugbear
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "S", # bandit
  "W", # pycodestyle
  "UP", # pyupgrade
  "C4", # flake8-comprehensions
  "ANN", # flake8-annotations
  "TRY", # tryceratops
  "PERF", # perflint
  "ASYNC", # flake8-async
]

# Globally ignore noisy rules
ignore = [
  "E402", # module level import not at top of file
  "TRY003", # Avoid specifying long messages outside the exception class
  "TRY301", # Abstract `raise` to an inner function
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101", # Allow use of assert statements in tests
  "S105", # hardcoded-password-string
  "S106", # hardcoded-password-func-arg
]

[tool.ruff.format] # https://docs.astral.sh/ruff/settings/#format
quote-style = "double" # Quote style, double quotes are default

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra --strict-config --strict-markers -m 'not live and not private and not stateful and not generated'"
filterwarnings = [
  "error",
  "ignore::pytest.PytestUnraisableExceptionWarning",
  "ignore::ResourceWarning",
  "ignore::pytest.PytestCollectionWarning",
  "ignore:Module.*was never imported",
  "ignore:No data was collected",
  "ignore:Failed to generate report",
]
markers = [
  "asyncio: marks tests as asyncio tests",
  "live: marks tests that call live exchange APIs",
  "private: marks tests that require private API keys",
  "generated: marks tests that request generation of downloadable reports or similar server-side artifacts",
  "stateful: marks tests that can mutate exchange or account state",
]
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.pyright]
exclude = [
    ".venv",
    ".uv-cache",
    ".cache",
    "tests",
    "examples",
]
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."
