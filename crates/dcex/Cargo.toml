[package]
name = "dcex"
description = "Async Rust crypto exchange API library for CEX and DEX market data, trading and WebSocket streams (Binance, Bybit, OKX, Hyperliquid and more)."
homepage = "https://github.com/pg56714/dcex"
documentation = "https://docs.rs/dcex"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
version = "0.20.0"
keywords = ["crypto", "trading", "exchange", "websocket", "binance"]
categories = [
  "api-bindings",
  "finance",
  "web-programming::http-client",
  "web-programming::websocket",
]

[dependencies]
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = { version = "2.2", default-features = false, features = [
  "fast",
  "std",
] }
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "std",
] }
flate2 = "1"
hex = "0.4"
getrandom = "0.2"
hmac = "0.12"
log = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
  "brotli",
  "charset",
  "deflate",
  "gzip",
  "http2",
  "json",
  "rustls-tls",
] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
sha3 = "0.10"
starknet-crypto = "0.8.1"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.26", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
url = "2"
