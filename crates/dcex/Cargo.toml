[package]
name = "dcex"
description = "Rust core library for low-latency cross-exchange crypto trading."
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
version = "0.4.3"
keywords = ["crypto", "trading", "exchange", "http"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2", default-features = false, features = [
  "fast",
  "std",
] }
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "std",
] }
flate2 = "1"
hex = "0.4"
getrandom = "0.2"
hmac = "0.12"
num-bigint = "0.4"
num-traits = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
  "brotli",
  "charset",
  "deflate",
  "gzip",
  "http2",
  "json",
  "rustls-tls",
] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.26", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
url = "2"
