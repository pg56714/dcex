name: "Bug report"
description: "Create a report to help us improve the dcex Python package or Rust crate."
title: "bug: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report. This helps us improve the dcex Python package and Rust crate.
  - type: textarea
    id: describe
    attributes:
      label: "Describe the Bug"
      description: "Please provide a clear and concise description of the issue you encountered. If possible, attach screenshots or error logs to help us understand the problem."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "Please list the steps to reproduce the issue:"
      value: |
        1. Install/import the Python package or add the Rust crate ...
        2. Set up exchange connection ...
        3. Try to execute ...
        4. See the error
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: "Code Example"
      description: "Please provide a minimal Python or Rust code example that reproduces the error"
      value: |
        ```python
        # Python example, if applicable
        import dcex

        # Steps that show the error
        ```

        ```rust
        // Rust example, if applicable
        ```
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: "Environment Information"
      description: "Please provide your Python/Rust version, operating system, and dcex package/crate version"
      placeholder: "e.g., Python 3.12, Rust stable, Windows 11, PyPI dcex X.Y.Z or crate dcex X.Y.Z"
    validations:
      required: true
  - type: dropdown
    id: exchange
    attributes:
      label: "Related Exchange"
      description: "Which exchange module is this issue related to?"
      options:
        - "N/A"
        - "Aster"
        - "Backpack"
        - "Binance"
        - "Bitget"
        - "Bybit"
        - "Extended"
        - "BitMart"
        - "BingX"
        - "Hyperliquid"
        - "OKX"
        - "KuCoin"
        - "Kraken"
        - "Lighter"
        - "MEXC"
        - "BitMEX"
        - "Other (please specify in description)"
    validations:
      required: true
  - type: checkboxes
    id: validation
    attributes:
      label: "Submission Checklist"
      description: "Before submitting this issue, please ensure you have completed the following:"
      options:
        - label: "Follow our [Code of Conduct](https://github.com/pg56714/dcex/blob/main/.github/CODE_OF_CONDUCT.md)"
          required: true
        - label: "Check that there isn't [already an issue](https://github.com/pg56714/dcex/issues) reporting the same bug to avoid duplicates."
          required: true
        - label: "I have updated to the latest version of dcex and confirmed the issue still exists"
          required: true
