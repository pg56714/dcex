name: Release Rust Crate

on:
  push:
    tags:
      - "rust-v*"

permissions:
  contents: write

jobs:
  publish_crate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches crate version
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dcex") | .version')"
          EXPECTED_TAG="rust-v${VERSION}"
          echo "Crate version: ${VERSION}"
          echo "Expected tag: ${EXPECTED_TAG}"
          echo "Actual tag: ${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag must match crates/dcex/Cargo.toml version."
            exit 1
          fi

      - name: Publish dcex to crates.io
        run: cargo publish -p dcex --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Create Rust GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Rust ${{ github.ref_name }}
          body: "Publishes the Rust `dcex` crate to crates.io."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
