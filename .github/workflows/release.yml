name: Release and Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump_version:
    runs-on: ubuntu-latest
    outputs:
      cz_version: ${{ steps.cz.outputs.version }}
      has_bump: ${{ steps.check_bump.outputs.has_bump }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create bump and changelog
        id: cz
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog_increment_filename: body.md

      - name: Check if bump occurred
        id: check_bump
        env:
          PREV_VERSION: ${{ steps.cz.outputs.previous_version }}
          CURR_VERSION: ${{ steps.cz.outputs.version }}
        run: |
          echo "Previous version: ${PREV_VERSION:-unknown}"
          echo "Current version: ${CURR_VERSION:-unknown}"

          if [ -n "${CURR_VERSION}" ] && [ "${PREV_VERSION}" != "${CURR_VERSION}" ]; then
            echo "Version bump detected (versions differ)."
            echo "has_bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "No version bump detected."
            echo "has_bump=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f body.md ]; then
            echo "Preview of body.md:"
            head -n 20 body.md
          fi

      - name: Debug output
        run: |
          echo "Bumped version: ${{ steps.cz.outputs.version }}"
          echo "Has bump: ${{ steps.check_bump.outputs.has_bump }}"

      - name: Release
        if: ${{ steps.check_bump.outputs.has_bump == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          body_path: "body.md"
          tag_name: ${{ steps.cz.outputs.version }}
          name: ${{ steps.cz.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_python_artifacts:
    needs: bump_version
    if: ${{ success() && needs.bump_version.outputs.has_bump == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.bump_version.outputs.cz_version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: uv sync --locked

      - name: Build wheel
        run: |
          VERSION=${{ needs.bump_version.outputs.cz_version }}
          echo "Building wheel for version $VERSION..."
          uv build --wheel --out-dir dist

      - name: Build source distribution
        if: ${{ runner.os == 'Linux' }}
        run: uv build --sdist --out-dir dist

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-dist-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish_if_bumped:
    needs: [bump_version, build_python_artifacts]
    if: ${{ success() && needs.bump_version.outputs.has_bump == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout (job-level permissions replace the top-level block)
      id-token: write # required for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Download Python artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        run: |
          VERSION=${{ needs.bump_version.outputs.cz_version }}
          echo "Publishing version $VERSION to PyPI..."
          uv publish dist/*
