name: Release Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rust_tag:
        description: Existing Rust release tag to publish
        required: true
        type: string
      rust_version:
        description: Rust crate version to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      any_release: ${{ steps.plan.outputs.any_release }}
      python_release: ${{ steps.plan.outputs.python_release }}
      python_version: ${{ steps.plan.outputs.python_version }}
      python_tag: ${{ steps.plan.outputs.python_tag }}
      python_body_path: ${{ steps.plan.outputs.python_body_path }}
      rust_release: ${{ steps.plan.outputs.rust_release }}
      rust_version: ${{ steps.plan.outputs.rust_version }}
      rust_tag: ${{ steps.plan.outputs.rust_tag }}
      rust_body_path: ${{ steps.plan.outputs.rust_body_path }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Plan releases
        id: plan
        run: |
          uv run --no-project scripts/release_plan.py --format text --github-output "$GITHUB_OUTPUT"

  apply:
    needs: plan
    if: ${{ needs.plan.outputs.any_release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      python_release: ${{ needs.plan.outputs.python_release }}
      python_version: ${{ needs.plan.outputs.python_version }}
      python_tag: ${{ needs.plan.outputs.python_tag }}
      python_body_path: ${{ needs.plan.outputs.python_body_path }}
      rust_release: ${{ needs.plan.outputs.rust_release }}
      rust_version: ${{ needs.plan.outputs.rust_version }}
      rust_tag: ${{ needs.plan.outputs.rust_tag }}
      rust_body_path: ${{ needs.plan.outputs.rust_body_path }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Apply release plan
        run: |
          uv run --no-project scripts/release_plan.py --apply --format text --body-dir .release

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit release files
        run: |
          git add CHANGELOG.md pyproject.toml uv.lock Cargo.lock crates/dcex/Cargo.toml
          if [ -f crates/dcex/CHANGELOG.md ]; then
            git add crates/dcex/CHANGELOG.md
          fi
          if git diff --cached --quiet; then
            echo "No release file changes to commit."
          else
            git commit -m "chore: release packages"
          fi

      - name: Create release tags
        run: |
          if [ "${{ needs.plan.outputs.python_release }}" = "true" ]; then
            git tag "${{ needs.plan.outputs.python_tag }}"
          fi
          if [ "${{ needs.plan.outputs.rust_release }}" = "true" ]; then
            git tag "${{ needs.plan.outputs.rust_tag }}"
          fi

      - name: Push release commit and tags
        run: |
          refs=(HEAD:main)
          if [ "${{ needs.plan.outputs.python_release }}" = "true" ]; then
            refs+=("${{ needs.plan.outputs.python_tag }}")
          fi
          if [ "${{ needs.plan.outputs.rust_release }}" = "true" ]; then
            refs+=("${{ needs.plan.outputs.rust_tag }}")
          fi
          git push --atomic origin "${refs[@]}"

      - name: Upload release metadata
        uses: actions/upload-artifact@v5
        with:
          name: release-metadata
          path: .release/*
          include-hidden-files: true
          if-no-files-found: error

  build_python_artifacts:
    needs: apply
    if: ${{ success() && needs.apply.outputs.python_release == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.apply.outputs.python_tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: uv sync --locked

      - name: Build wheel
        run: uv run maturin build --release --out dist --compatibility pypi

      - name: Build source distribution
        if: ${{ runner.os == 'Linux' }}
        run: uv build --sdist --out-dir dist

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-dist-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish_python:
    needs: [apply, build_python_artifacts]
    if: ${{ success() && needs.apply.outputs.python_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Download Python artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true

      - name: Download release metadata
        uses: actions/download-artifact@v5
        with:
          name: release-metadata
          path: .release

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/ dist/*

      - name: Create Python GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ needs.apply.outputs.python_body_path }}
          tag_name: ${{ needs.apply.outputs.python_tag }}
          name: Python ${{ needs.apply.outputs.python_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_rust:
    needs: apply
    if: ${{ success() && needs.apply.outputs.rust_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.apply.outputs.rust_tag }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Download release metadata
        uses: actions/download-artifact@v5
        with:
          name: release-metadata
          path: .release

      - name: Check tag matches crate version
        id: crate
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dcex") | .version')"
          EXPECTED_TAG="rust-v${VERSION}"
          echo "Crate version: ${VERSION}"
          echo "Expected tag: ${EXPECTED_TAG}"
          echo "Actual tag: ${{ needs.apply.outputs.rust_tag }}"
          if [ "${{ needs.apply.outputs.rust_tag }}" != "${EXPECTED_TAG}" ]; then
            echo "Tag must match crates/dcex/Cargo.toml version."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check crates.io publication status
        id: publication
        env:
          VERSION: ${{ steps.crate.outputs.version }}
        run: |
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent 'dcex-release-workflow/1.0' \
            "https://crates.io/api/v1/crates/dcex/${VERSION}")"
          case "${STATUS}" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected crates.io response: HTTP ${STATUS}"
              exit 1
              ;;
          esac

      - name: Authenticate to crates.io
        if: ${{ steps.publication.outputs.published != 'true' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish dcex to crates.io
        if: ${{ steps.publication.outputs.published != 'true' }}
        run: cargo publish -p dcex --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create Rust GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ needs.apply.outputs.rust_body_path }}
          tag_name: ${{ needs.apply.outputs.rust_tag }}
          name: Rust ${{ needs.apply.outputs.rust_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_rust_manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.rust_tag }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Validate Rust release
        env:
          RUST_TAG: ${{ inputs.rust_tag }}
          RUST_VERSION: ${{ inputs.rust_version }}
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dcex") | .version')"
          EXPECTED_TAG="rust-v${VERSION}"
          echo "Crate version: ${VERSION}"
          echo "Expected tag: ${EXPECTED_TAG}"
          echo "Requested tag: ${RUST_TAG}"
          echo "Requested version: ${RUST_VERSION}"
          if [ "${RUST_TAG}" != "${EXPECTED_TAG}" ] || [ "${RUST_VERSION}" != "${VERSION}" ]; then
            echo "Requested tag and version must match crates/dcex/Cargo.toml."
            exit 1
          fi

      - name: Write Rust release body
        env:
          RUST_VERSION: ${{ inputs.rust_version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RUST_VERSION"]
          changelog = Path("crates/dcex/CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## {re.escape(version)}(?:\s|\().*?(?=^## |\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          if match is None:
              raise SystemExit(f"Cannot find Rust CHANGELOG section for {version}.")

          Path(".release").mkdir(exist_ok=True)
          Path(".release/rust-body.md").write_text(
              match.group(0).strip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Check crates.io publication status
        id: publication
        env:
          RUST_VERSION: ${{ inputs.rust_version }}
        run: |
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent 'dcex-release-workflow/1.0' \
            "https://crates.io/api/v1/crates/dcex/${RUST_VERSION}")"
          case "${STATUS}" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected crates.io response: HTTP ${STATUS}"
              exit 1
              ;;
          esac

      - name: Authenticate to crates.io
        if: ${{ steps.publication.outputs.published != 'true' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish dcex to crates.io
        if: ${{ steps.publication.outputs.published != 'true' }}
        run: cargo publish -p dcex --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create Rust GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: .release/rust-body.md
          tag_name: ${{ inputs.rust_tag }}
          name: Rust ${{ inputs.rust_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
