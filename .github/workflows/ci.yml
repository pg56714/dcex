name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Lint, Format, Type Check, Test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: uv sync --locked

      - name: Check generated artifacts without writing
        run: |
          for generator in scripts/build_*.py; do
            module="scripts.$(basename "$generator" .py)"
            if [ "$module" = "scripts.build_hyperliquid_action_vectors" ]; then
              uv run --no-sync --with hyperliquid-python-sdk==0.24.0 python -B -m "$module" --check
            else
              uv run --no-sync python -B -m "$module" --check
            fi
          done

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust check
        run: cargo check --workspace --all-features

      - name: Rust tests
        run: cargo test --workspace --all-features

      - name: Build native Python extension
        run: uv run maturin develop --release

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff format)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Run offline unit tests
        run: uv run pytest tests/unit
