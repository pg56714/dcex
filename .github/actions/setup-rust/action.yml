name: Set up Rust
description: Install the Rust version pinned in rust-toolchain.toml, with clippy and rustfmt.

runs:
  using: composite
  steps:
    - name: Read the pinned Rust version
      id: pinned
      shell: bash
      run: |
        version="$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        if [ -z "$version" ]; then
          echo "rust-toolchain.toml does not name a channel" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install Rust ${{ steps.pinned.outputs.version }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.pinned.outputs.version }}
        components: clippy, rustfmt
